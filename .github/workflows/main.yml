name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # If your gradle files are in a subfolder, add the path below:
          # cache-dependency-path: 'your-subfolder/build.gradle' 

      # Fix: Added 'working-directory' to tell GitHub where your android files live
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: . # 👈 Change '.' to your subfolder name (e.g., android) if needed

      # Fix: Added 'working-directory' here as well
      - name: Build with Gradle
        run: ./gradlew assembleDebug
        working-directory: . # 👈 Change '.' to your subfolder name (e.g., android) if needed

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-debug-apk
          path: '**/build/outputs/apk/debug/*.apk' # 👈 Uses a wildcard to find the APK anywhere it was built

